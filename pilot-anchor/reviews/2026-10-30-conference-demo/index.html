<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>学会用デモの画面確認</title>
<style>body{margin:0;background:#f5f7f8;color:#172b3a;font:16px/1.7 system-ui,sans-serif}main{max-width:1200px;padding:32px 20px;margin:auto}h1{font-size:27px}nav{display:flex;gap:10px;flex-wrap:wrap}button,a{font:inherit}button{border:1px solid #bac6cc;border-radius:8px;background:white;padding:8px 14px;cursor:pointer}button[aria-pressed=true]{background:#164f71;color:white}.shots{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;margin-top:24px}figure{margin:0;background:white;padding:12px;border-radius:12px}figcaption{margin-bottom:10px;font-weight:650}img{width:100%;height:auto;border:1px solid #dde4e8}p{max-width:75ch}a{color:#155d8c}</style>
<main><h1>学会用デモの画面確認</h1><p>問題 → 迷い・自信 → 結果 → もう一度。Chromeによる合成操作の記録です。実機確認とは区別しています。</p><p><a href="../../?demo=conference">体験デモを開く</a> · <a href="README.md">確認内容</a> · <a href="../../distribution-assets/conference-demo-qr.png">QRコード</a></p><nav aria-label="画面サイズ"><button data-size="mini" aria-pressed="true">小画面 375×548</button><button data-size="iphone" aria-pressed="false">402×759</button><button data-size="android" aria-pressed="false">360×740</button><button data-size="desktop" aria-pressed="false">PC 1280×900</button></nav><div class="shots" id="shots"></div></main>
<script>const screens=[['question','第1問'],['question3','第3問'],['rating','迷いの評定'],['results','軌跡・時間・評定'],['results-bottom','結果の末尾と再実施']];function show(size){document.getElementById('shots').replaceChildren(...screens.map(([key,label])=>{const f=document.createElement('figure'),c=document.createElement('figcaption'),i=document.createElement('img');c.textContent=label;i.src=size+'-'+key+'.png';i.alt=label;i.loading='lazy';f.append(c,i);return f}));for(const b of document.querySelectorAll('button'))b.setAttribute('aria-pressed',b.dataset.size===size)}for(const b of document.querySelectorAll('button'))b.onclick=()=>show(b.dataset.size);show('mini');</script></html>
